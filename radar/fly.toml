# fly.io deployment. Gives Radar a persistent volume, so accounts, saved
# opportunities and tracked applications survive every deploy.
#
#   fly launch --no-deploy --copy-config --name your-radar-name
#   fly volumes create radar_data --size 1 --region lhr
#   fly deploy
#   fly ssh console -C "node server/create-admin.js you@example.com 'a long passphrase'"

app = "radar"
primary_region = "lhr"   # lhr = London. Closer to the UAE: "cdg" or "fra".

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  RADAR_DB = "/data/radar.db"

[[mounts]]
  source = "radar_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # One machine only: SQLite is a single file on one volume, so a second
  # machine would be writing to a different database.
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
