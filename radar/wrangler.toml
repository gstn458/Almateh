# Cloudflare Workers deployment (static assets only — no Worker code).
#
# Radar's front end is plain files, so Cloudflare serves public/ directly from
# its edge. This is the same offline mode described in DEPLOY.md: the directory,
# matching and the tracker work, but per browser, with no accounts and no admin.
#
# In the Cloudflare "Create an app" flow set:
#   Path (Advanced settings)   /radar
#   Build command              npm run build
#   Deploy command             npx wrangler deploy
#
# `name` has to match the Worker service Cloudflare created for this repo.
name = "almateh"
compatibility_date = "2026-08-01"

[assets]
directory = "./public"
# Unknown paths get Radar's own 404 page rather than Cloudflare's.
not_found_handling = "404-page"
