<div class="wrap section section--flush" style="max-width:520px">
  <p class="eyebrow">Create an account</p>
  <h1 class="h2">Start with a profile, not a search box.</h1>
  <p class="lede" style="font-size:15px">Free, no payment card, and you can export or delete everything at any time.</p>
  <p class="notice" id="storage-mode" hidden></p>

  <div data-google-block hidden>
    <button class="btn btn--ghost btn--block" type="button" data-google-signin>
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 18 18" focusable="false">
        <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/>
        <path fill="#FBBC05" d="M3.97 10.72a5.4 5.4 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3.01-2.33z"/>
        <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.9 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/>
      </svg>
      Continue with Google
    </button>
    <p class="meta" style="text-align:center;margin:1.4rem 0">or use an email address</p>
  </div>

  <form id="signup-form" style="margin-top:1.5rem">
    <p class="form-error" data-form-error hidden></p>
    <label class="field">
      <span class="field__label" for="name">Your name</span>
      <input class="input" id="name" name="name" type="text" autocomplete="name" maxlength="120">
      <span class="field__hint">Optional. Only used to greet you.</span>
    </label>
    <label class="field">
      <span class="field__label" for="email">Email</span>
      <input class="input" id="email" name="email" type="email" required autocomplete="email" autocapitalize="off" spellcheck="false">
      <span class="field__error" data-field-error="email"></span>
    </label>
    <label class="field">
      <span class="field__label" for="password">Password</span>
      <input class="input" id="password" name="password" type="password" required autocomplete="new-password" minlength="10"
             aria-describedby="password-hint">
      <span class="field__hint" id="password-hint">At least 10 characters. A short phrase you will remember beats a clever password you will not.</span>
      <span class="field__error" data-field-error="password"></span>
    </label>
    <label class="checkbox">
      <input type="checkbox" name="isMinor" value="1">
      <span>I am under 18. <span style="display:block;color:var(--muted-dim);font-size:13px;margin-top:.2rem">Radar asks for less information and applies stricter data handling. Ask a parent, guardian or teacher first if you are under 16.</span></span>
    </label>
    <label class="checkbox">
      <input type="checkbox" name="acceptedTerms" value="1" required>
      <span>I accept the <a href="/terms.html">terms of use</a> and the <a href="/privacy.html">privacy policy</a>.</span>
    </label>
    <span class="field__error" data-field-error="acceptedTerms"></span>
    <button class="btn btn--primary btn--block" type="submit" style="margin-top:.5rem">Create account</button>
  </form>

  <p class="form-note">Already have an account? <a href="/app/login.html" style="color:var(--signal);text-decoration:underline">Sign in</a>.</p>
</div>
